[pytest]
testpaths = tests
addopts = -v --tb=short --udid emulator-5554
markers =
    smoke: Critical smoke tests
    regression: Regression suite
    mobile: Mobile UI Appium tests
    api: API integration tests
    positive: Positive test scenarios
    negative: Negative test scenarios
    practice: Candidate practice and interview exercises
    debug_trainer: Debugging trainer and logcat diagnostics tasks
    catalog: Catalog screen and product listing tests
    sorting: Product sorting tests
    navigation: Header and drawer menu navigation tests
    auth: Authentication and session management tests
    product_details: Product details screen tests
    cart: Shopping cart tests
    checkout: Checkout flow and validation tests
    webview: WebView screen tests
    device_features: Hardware and system features
    gestures_lifecycle: Touch gestures, rotation, backgrounding tests

