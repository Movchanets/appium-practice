[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-atqc-bootcamp"
version = "0.1.0"
description = "Senior Mobile QA Automation Engineering Bootcamp (Appium 2.x, pytest, API, Best Practices)"
readme = "CLAUDE.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "Appium-Python-Client>=4.0.0",
    "selenium>=4.20.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "ruff>=0.4.0",
    "allure-pytest>=2.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: Critical smoke tests",
    "regression: Regression suite",
    "mobile: Mobile UI Appium tests",
    "api: API integration tests",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["B008"]
