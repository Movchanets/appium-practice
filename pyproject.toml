[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-atqc-bootcamp"
version = "0.1.0"
description = "Senior Mobile QA Automation Engineering Bootcamp (Appium 3.x, pytest, API, Best Practices)"
readme = "CLAUDE.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "Appium-Python-Client>=5.0.0",
    "selenium>=4.26.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "ruff>=0.4.0",
    "allure-pytest>=2.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: Critical smoke tests",
    "regression: Regression suite",
    "mobile: Mobile UI Appium tests",
    "api: API integration tests",
    "positive: Positive test scenarios",
    "negative: Negative test scenarios",
    "practice: Candidate practice and interview exercises",
    "debug_trainer: Debugging trainer and logcat diagnostics tasks",
    "catalog: Catalog screen and product listing tests",
    "sorting: Product sorting tests",
    "navigation: Header and drawer menu navigation tests",
    "auth: Authentication and session management tests",
    "product_details: Product details screen tests",
    "cart: Shopping cart tests",
    "checkout: Checkout flow and validation tests",
    "webview: WebView screen tests",
    "device_features: Hardware and system features",
    "gestures_lifecycle: Touch gestures, rotation, backgrounding tests",
]
addopts = "-v --tb=short --allure-link-pattern=issue:https://github.com/Movchanets/appium-practice/issues/{}"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["B008"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "types-requests>=2.33.0.20261030",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "."
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_untyped_calls = false
explicit_package_bases = true
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "allure.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "appium.*"
ignore_missing_imports = true


